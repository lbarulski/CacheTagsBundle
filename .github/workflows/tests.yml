name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    name: Symfony ${{ matrix.symfony }} / PHP ${{ matrix.php }}${{ matrix.deps == 'lowest' && ' / lowest deps' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            symfony: '3.4'
          - php: '8.1'
            symfony: '3.4'
          - php: '7.4'
            symfony: '4.4'
          - php: '8.0'
            symfony: '4.4'
          - php: '8.3'
            symfony: '4.4'
          - php: '7.4'
            symfony: '5.4'
          - php: '8.0'
            symfony: '5.4'
          - php: '8.2'
            symfony: '5.4'
          - php: '8.4'
            symfony: '5.4'
          - php: '8.1'
            symfony: '6.4'
          - php: '8.2'
            symfony: '6.4'
          - php: '8.3'
            symfony: '6.4'
          - php: '8.4'
            symfony: '6.4'
          - php: '7.4'
            symfony: '4.4'
            deps: lowest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require \
            'symfony/config:^${{ matrix.symfony }}' \
            'symfony/console:^${{ matrix.symfony }}' \
            'symfony/dependency-injection:^${{ matrix.symfony }}' \
            'symfony/http-kernel:^${{ matrix.symfony }}' \
            'symfony/yaml:^${{ matrix.symfony }}' \
            --no-update
          composer require --dev 'symfony/framework-bundle:^${{ matrix.symfony }}' --no-update
          composer update --prefer-dist --no-progress --no-security-blocking ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: PHPUnit
        run: composer test
